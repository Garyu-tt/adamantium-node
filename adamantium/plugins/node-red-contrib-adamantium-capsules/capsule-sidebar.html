<!-- Editor-side plugin only. Never registers executable Node-RED flow nodes. -->
<script type="text/javascript">
(function () {
    "use strict";
    const TAB = "adamantium-capsules-r02";
    const ACTION = "adamantium:show-capsule-studio";
    const RESOURCE = "resources/node-red-contrib-adamantium-capsules/preview/index.html";
    const LENS_RESOURCE = "resources/node-red-contrib-adamantium-capsules/native-canvas-lens.mjs";
    RED.plugins.registerPlugin(TAB, {
        type: "adamantium-editor-sidebar",
        onadd: function () {
            if (RED.sidebar.containsTab(TAB)) {
                return;
            }
            const content = $("<div>").css({
                "display": "flex", "flex-direction": "column",
                "height": "100%", "min-height": "180px"
            });
            const toolbar = $("<div>").css({
                "display": "flex", "gap": "6px", "flex-wrap": "wrap", "padding": "8px"
            }).appendTo(content);
            const label = $("<div>").text("Локальные графы · исходники не исполняются")
                .css({"font-size":"11px","opacity":"0.75","padding":"0 8px 8px"}).appendTo(content);
            // This is a packaged, fixed URL. Never interpolate node parameters
            // or user-defined sources into iframe src.
            const url = new URL(RESOURCE, document.baseURI).href;
            const frame = $("<iframe>").attr({
                "title": "Adamantium Capsule Studio",
                "sandbox": "allow-scripts allow-same-origin allow-downloads",
                "referrerpolicy": "no-referrer",
                "loading": "lazy"
            }).css({
                "width": "100%", "flex": "1 1 auto", "min-height": "340px",
                "border": "0", "background": "var(--red-ui-primary-background-color, #1a2431)"
            }).appendTo(content);
            let initialized = false;
            let lens = null;
            let lensPromise = null;
            const iframe = frame[0];
            function sendToStudio(command) {
                if (initialized && iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage(command, window.location.origin);
                }
            }
            function requestProjection() {
                sendToStudio({type:"adamantium:native-canvas-refresh/1"});
            }
            function forwardIntent(action,params) {
                sendToStudio(Object.assign({
                    type:"adamantium:native-canvas-intent/1",action
                },params));
            }
            const onProjection = function(event) {
                if (event.origin !== window.location.origin ||
                    !iframe || event.source !== iframe.contentWindow)return;
                const message=event.data;
                if (!message || message.type!=="adamantium:native-canvas-projection/1")return;
                try {
                    if (lens) lens.setProjection(message.projection);
                }catch(error) {
                    label.text("Canvas: отклонён некорректный граф");
                }
            };
            window.addEventListener("message",onProjection);
            frame.on("load",requestProjection);
            function start() {
                if (!initialized) {
                    frame.attr("src", url);
                    initialized = true;
                }
            }
            function createLens() {
                if (lens) return Promise.resolve(lens);
                if (!lensPromise) {
                    const moduleURL=new URL(LENS_RESOURCE, document.baseURI).href;
                    lensPromise=import(moduleURL).then(function(module) {
                        lens=module.createNativeCanvasLens({
                            RED:RED,
                            onNavigate:function(e) {
                                forwardIntent("enter",{
                                    graphId:e.graphId,childGraphId:e.childGraphId,nodeId:e.nodeId
                                });
                            },
                            onMove:function(e){forwardIntent("move",e);},
                            onConnect:function(e){forwardIntent("connect",e);},
                            onWarning:function(text){label.text("Canvas: "+text);}
                        });
                        return lens;
                    }).catch(function(error){
                        lensPromise=null;
                        throw error;
                    });
                }
                return lensPromise;
            }
            const canvasButton=$("<button>",{
                "type":"button","text":"Canvas: выключен",
                "title":"Отдельный графовый слой на настоящем SVG Node-RED, без /flows и Deploy"
            }).on("click",function(){
                start();
                createLens().then(function(result){
                    const enabled=result.show(!result.status().active);
                    canvasButton.text(enabled?"Canvas: включён":"Canvas: выключен");
                    if (enabled)requestProjection();
                    label.text(enabled?
                        "Canvas: SVG-слой только для редактирования, без исполнения":
                        "Локальные графы · исходники не исполняются");
                }).catch(function(error){
                    label.text("Canvas: ошибка загрузки редактора");
                });
            }).appendTo(toolbar);
            $("<button>",{"type":"button","text":"Открыть графы"})
                .on("click",start).appendTo(toolbar);
            $("<button>",{"type":"button","text":"На весь экран ↗"})
                .on("click",function() {
                    start();
                    window.open(url,"_blank","noopener,noreferrer");
                }).appendTo(toolbar);
            RED.actions.add(ACTION,function(){
                RED.sidebar.show(TAB);
            });
            RED.sidebar.addTab({
                id:TAB,
                name:"Adamantium Capsule Studio",
                label:"Capsules",
                iconClass:"fa fa-object-group",
                content:content,
                action:ACTION,
                onchange:start
            });
        }
    });
})();
</script>
