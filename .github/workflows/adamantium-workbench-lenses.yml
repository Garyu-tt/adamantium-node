name: Adamantium workbench lenses R01
on:
  pull_request:
    paths:
      - 'adamantium/workbench-lenses.mjs'
      - 'test/adamantium/workbench-lenses.test.mjs'
      - '.github/workflows/adamantium-workbench-lenses.yml'
  push:
    branches:
      - 'feat/workbench-lenses-r01-20261120'
    paths:
      - 'adamantium/workbench-lenses.mjs'
      - 'test/adamantium/workbench-lenses.test.mjs'
      - '.github/workflows/adamantium-workbench-lenses.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  view-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated workbench lenses
        run: node --test test/adamantium/workbench-lenses.test.mjs
