name: Adamantium Factory R08 Off-host Ed25519 Anchor
on:
  push:
    paths:
      - 'adamantium/node-factory/*r08.*'
      - 'test/adamantium/node-factory-offhost*r08.test.*'
      - 'docs/FACTORY-R08.md'
      - '.github/workflows/adamantium-factory-r08.yml'
  pull_request:
    paths:
      - 'adamantium/node-factory/*r08.*'
      - 'test/adamantium/node-factory-offhost*r08.test.*'
      - 'docs/FACTORY-R08.md'
      - '.github/workflows/adamantium-factory-r08.yml'
permissions:
  contents: read
jobs:
  node-public-verifier:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify public second signature and collision-safe visual observer
        run: node --test test/adamantium/node-factory-offhost-verifier-r08.test.mjs test/adamantium/node-factory-offhost-studio-r08.test.mjs
  python-offhost-signer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=38,<50'
      - name: Offline signer pin, fail-closed tampering, mutex, replay
        run: python test/adamantium/node-factory-offhost-r08.test.py
  real-cross-language-node-red:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=38,<50'
      - name: Install locked Node-RED v5 deps without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real Node-RED 5 → R05 journal → R06 Ed25519 → Python R08 → JS cross-verification
        run: node --test test/adamantium/node-factory-offhost-real-r08.test.mjs
