name: Adamantium Construct Native R02
on:
  push:
    branches:
      - feature/construct-native-canvas-r02
  pull_request:
    paths:
      - "adamantium/construct-native/**"
      - "adamantium/plugins/node-red-contrib-adamantium-construct/**"
      - "test/adamantium/construct-native.test.mjs"
      - ".github/workflows/construct-native-r02.yml"
jobs:
  native-q-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Safe structural editor tests
        run: |
          node --check adamantium/construct-native/core.mjs
          node --test test/adamantium/construct-native.test.mjs
