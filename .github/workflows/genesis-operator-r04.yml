name: GENESIS Operator R04 Additive Tests
on:
  pull_request:
    paths:
      - 'experiments/genesis/operator-r04/**'
      - '.github/workflows/genesis-operator-r04.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned R04 package and extract in isolation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 40 \
            'https://raw.githubusercontent.com/Garyu-tt/adamantium-node/ff731742cc9552709d5ed52eab095297b1f9087c/experiments/genesis/r04-full.zip.b64' \
            > "$RUNNER_TEMP/r04.zip.b64"
          base64 -d "$RUNNER_TEMP/r04.zip.b64" > "$RUNNER_TEMP/r04.zip"
          echo '5e13361a770b30dce532642874f6490cfee8e649850f47287012f7945d4a8bcc  '"$RUNNER_TEMP"'/r04.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/r04"
          python3 - "$RUNNER_TEMP/r04.zip" "$RUNNER_TEMP/r04" <<'PY'
          import pathlib, sys, zipfile
          zpath,target=map(pathlib.Path,sys.argv[1:])
          with zipfile.ZipFile(zpath) as z:
              for item in z.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  assert not item.is_dir() and not p.is_absolute() and '..' not in p.parts
                  assert item.file_size<100000
              z.extractall(target)
          PY
      - name: Validate JavaScript syntax and additive tests
        env:
          GENESIS_TEST_R04_PATH: ${{ runner.temp }}/r04
        run: |
          node --check experiments/genesis/operator-r04/operator.cjs
          node --check experiments/genesis/operator-r04/monitor/validate-result.function.js
          node --test experiments/genesis/operator-r04/test/operator-r04.test.cjs experiments/genesis/operator-r04/test/monitor.test.cjs
