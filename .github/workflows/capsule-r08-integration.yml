name: Capsule R08 native SVG plus Construct integration

on:
  push:
    branches:
      - integration/capsule-r08-construct-r07-vm122
  pull_request:
    paths:
      - 'adamantium/capsule-native-canvas.mjs'
      - 'adamantium/capsule-native-layout.mjs'
      - 'adamantium/capsule-preview/**'
      - 'adamantium/construct-engine.mjs'
      - 'adamantium/plugins/node-red-contrib-adamantium-capsules/**'
      - 'test/adamantium/capsule-integration-r08.test.mjs'
      - 'test/adamantium/capsule-native-canvas.test.mjs'
      - '.github/workflows/capsule-r08-integration.yml'

jobs:
  editor-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate package resources and JavaScript syntax
        run: node --check adamantium/capsule-native-canvas.mjs
      - name: Construct and native SVG editor integration tests
        run: node --test test/adamantium/capsule-integration-r08.test.mjs test/adamantium/capsule-native-canvas.test.mjs test/adamantium/capsule-native-layout.test.mjs test/adamantium/capsule-plugin.test.mjs test/adamantium/capsule-preview.test.mjs test/adamantium/construct-engine.test.mjs
