name: Adamantium Node Factory R03 — Isolated Admin API
on:
  push:
    paths:
      - 'adamantium/node-red-adapter/**'
      - 'adamantium/node-factory/**'
      - 'test/adamantium/node-factory-admin-*.test.mjs'
      - '.github/workflows/adamantium-node-factory-r03.yml'
      - 'docs/NODE-FACTORY-R03.md'
  pull_request:
    paths:
      - 'adamantium/node-red-adapter/**'
      - 'adamantium/node-factory/**'
      - 'test/adamantium/node-factory-admin-r03.test.mjs'
      - '.github/workflows/adamantium-node-factory-r03.yml'
      - 'docs/NODE-FACTORY-R03.md'
permissions:
  contents: read
jobs:
  isolated-node-red-5:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked workspace dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject non-loopback endpoints, foreign identities and unsafe types
        run: node --test test/adamantium/node-factory-admin-guards.test.mjs
      - name: Real local Node-RED 5 Admin API v2, execution and restart rollback
        run: node --test test/adamantium/node-factory-admin-r03.test.mjs
