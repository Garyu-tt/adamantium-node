name: Adamantium-node orchestration view contract
on:
  pull_request:
    paths:
      - 'adamantium/orchestration-*.mjs'
      - 'test/adamantium/orchestration-view-contract.test.mjs'
      - 'docs/adamantium/ORCHESTRATOR-WORKBENCH-R04.md'
      - '.github/workflows/adamantium-orchestration-view.yml'
  push:
    branches:
      - 'design/orchestrator-workbench-r04'
    paths:
      - 'adamantium/orchestration-*.mjs'
      - 'test/adamantium/orchestration-view-contract.test.mjs'
      - '.github/workflows/adamantium-orchestration-view.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/adamantium/orchestration-view-contract.test.mjs
