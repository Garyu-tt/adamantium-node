name: Adamantium signed read-only orchestration snapshots
on:
  pull_request:
    paths:
      - 'adamantium/orchestration-view-contract.mjs'
      - 'adamantium/orchestration-mobile-projection.mjs'
      - 'adamantium/orchestration-signed-snapshot.mjs'
      - 'test/adamantium/orchestration-signed-snapshot.test.mjs'
      - 'docs/adamantium/ORCHESTRATION-SIGNED-SNAPSHOT-R05.md'
      - '.github/workflows/adamantium-orchestration-signed.yml'
  push:
    branches:
      - 'design/orchestration-signed-readonly-r05'
    paths:
      - 'adamantium/orchestration-signed-snapshot.mjs'
      - 'test/adamantium/orchestration-signed-snapshot.test.mjs'
      - '.github/workflows/adamantium-orchestration-signed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-view-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate signed snapshot and existing R04 contracts
        run: node --test test/adamantium/orchestration-signed-snapshot.test.mjs test/adamantium/orchestration-view-contract.test.mjs
