name: Adamantium Capsule R07 — independent browser QA
on:
  push:
    branches: ["feature/capsules-r07-sync-safety-qa"]
  pull_request:
    paths:
      - "adamantium/capsule-canvas-geometry.mjs"
      - "adamantium/capsule-native-canvas.mjs"
      - "test/browser/**"
      - ".github/workflows/capsule-r07-browser-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-chromium-svg-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser is available (do not silently skip)
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "ADAMANTIUM_CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "ADAMANTIUM_CHROME_BIN=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "ADAMANTIUM_CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Chrome/Chromium not available for required R07 smoke" >&2
            exit 1
          fi
      - name: Actual Chromium SVG rendering and typed-port clicks
        run: node --test test/browser/capsule-native-chrome.test.mjs
