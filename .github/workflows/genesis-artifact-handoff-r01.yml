name: GENESIS Artifact Handoff R01
on:
  pull_request:
    paths:
      - 'experiments/genesis/artifact-handoff-r01/**'
      - '.github/workflows/genesis-artifact-handoff-r01.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and contracts
        run: |
          node --check experiments/genesis/artifact-handoff-r01/src/stage.mjs
          node --test experiments/genesis/artifact-handoff-r01/test/stage.test.mjs
