name: Adamantium Capsule Studio R03 (IR proposals)
on:
  push:
    branches: ["feature/capsules-ir-proposals-r03"]
  pull_request:
    paths:
      - "adamantium/capsule-**"
      - "adamantium/capsule-preview/**"
      - "adamantium/plugins/node-red-contrib-adamantium-capsules/**"
      - "test/adamantium/capsule-**"
      - ".github/workflows/capsule-studio-r03.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-ir-proposals:
    runs-on: ${d}{{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${d}{{ matrix.node }}
      - name: Syntax checks
        run: |
          node --check adamantium/capsule-studio.mjs
          node --check adamantium/capsule-extract.mjs
          node --check adamantium/capsule-ir-proposal.mjs
          node --check adamantium/capsule-draft-ledger.mjs
          node --check adamantium/capsule-preview/app.mjs
      - name: Pure contracts and local HTTP preview
        run: node --test test/adamantium/capsule-studio.test.mjs test/adamantium/capsule-extract.test.mjs test/adamantium/capsule-ir-proposal.test.mjs test/adamantium/capsule-draft-ledger.test.mjs test/adamantium/capsule-plugin.test.mjs test/adamantium/capsule-preview.test.mjs
