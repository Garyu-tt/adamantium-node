name: Adamantium Construct Vault R04
on:
  push:
    branches:
      - feature/construct-vault-logistics-r04
  pull_request:
    paths:
      - "adamantium/construct-native/vault*.mjs"
      - "adamantium/plugins/node-red-contrib-adamantium-construct/**"
      - "test/adamantium/construct-vault.test.mjs"
      - ".github/workflows/construct-vault-r04.yml"
jobs:
  vault-plan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax and source integrity
        run: |
          node --check adamantium/construct-native/vault.mjs
          node --check adamantium/construct-native/vault-editor.mjs
          node --test test/adamantium/construct-vault.test.mjs test/adamantium/construct-native.test.mjs
